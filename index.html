<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="近期事件回忆与文字表达研究参与者实验页面"
    />
    <meta name="theme-color" content="#123f46" />
    <title>近期事件回忆与文字表达研究</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <noscript>
      <div class="noscript-note">本实验页面需要启用 JavaScript 才能继续。</div>
    </noscript>

    <div id="app"></div>

    <dialog id="exit-dialog" class="dialog">
      <div class="dialog__body">
        <p class="eyebrow">退出确认</p>
        <h2>确定要结束本次实验吗？</h2>
        <p>
          退出后，本次任务将结束。你无需说明原因，相关安排以知情同意书为准。
        </p>
        <div class="dialog__actions">
          <button class="button button--ghost" type="button" data-dialog-close>
            继续实验
          </button>
          <button class="button button--danger" type="button" data-confirm-exit>
            确认退出
          </button>
        </div>
      </div>
    </dialog>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
