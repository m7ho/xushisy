<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心境 · MindFlow — 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7BAE8B;
    --sage-light: #A8C9B0;
    --sage-dark: #5A9070;
    --cream: #F8F5EF;
    --warm-white: #FDFCFA;
    --deep-teal: #2C5F6E;
    --deep-teal-light: #3D7A8A;
    --text-dark: #1E2D2F;
    --text-mid: #4A6670;
    --text-light: #8BA8B0;
    --error: #E05C5C;
    --success: #5BAD7F;
    --border: #DDE8DD;
    --shadow-sm: 0 2px 12px rgba(44,95,110,0.08);
    --shadow-md: 0 8px 32px rgba(44,95,110,0.12);
    --shadow-lg: 0 20px 60px rgba(44,95,110,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* Left decorative panel */
  .left-panel {
    width: 55%;
    background: linear-gradient(145deg, var(--deep-teal) 0%, #1a4a56 40%, #0f3340 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px;
    overflow: hidden;
  }

  .left-panel::before {
    content: '';
    position: absolute;
    top: -30%;
    right: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(circle, rgba(123,174,139,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }

  .left-panel::after {
    content: '';
    position: absolute;
    bottom: -20%;
    left: -10%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(123,174,139,0.1) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* Organic shapes */
  .blob {
    position: absolute;
    border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%;
    opacity: 0.06;
    background: var(--sage-light);
    animation: morphBlob 12s ease-in-out infinite;
  }
  .blob-1 { width: 300px; height: 300px; top: 5%; left: 5%; animation-delay: 0s; }
  .blob-2 { width: 200px; height: 200px; bottom: 15%; right: 10%; animation-delay: 4s; border-radius: 40% 60% 30% 70% / 60% 40% 70% 30%; }
  .blob-3 { width: 150px; height: 150px; top: 50%; left: 60%; animation-delay: 8s; }

  @keyframes morphBlob {
    0%, 100% { border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%; transform: rotate(0deg) scale(1); }
    33% { border-radius: 30% 70% 40% 60% / 70% 30% 60% 40%; transform: rotate(120deg) scale(1.05); }
    66% { border-radius: 70% 30% 50% 50% / 30% 70% 50% 50%; transform: rotate(240deg) scale(0.95); }
  }

  .brand {
    position: relative;
    z-index: 2;
    text-align: center;
    color: white;
    margin-bottom: 50px;
  }

  .brand-icon {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--sage) 0%, var(--sage-light) 100%);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 8px 24px rgba(123,174,139,0.4);
  }

  .brand-icon svg { width: 40px; height: 40px; fill: white; }

  .brand h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .brand p {
    font-size: 0.95rem;
    opacity: 0.65;
    letter-spacing: 0.1em;
    font-weight: 300;
  }

  .features {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 340px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    animation: slideInLeft 0.6s ease both;
  }

  .feature-item:nth-child(1) { animation-delay: 0.1s; }
  .feature-item:nth-child(2) { animation-delay: 0.2s; }
  .feature-item:nth-child(3) { animation-delay: 0.3s; }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .feature-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, rgba(123,174,139,0.3), rgba(123,174,139,0.1));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.3rem;
  }

  .feature-text h3 {
    color: white;
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .feature-text p {
    color: rgba(255,255,255,0.5);
    font-size: 0.78rem;
  }

  /* Right login form */
  .right-panel {
    width: 45%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: var(--warm-white);
  }

  .login-box {
    width: 100%;
    max-width: 400px;
    animation: fadeInUp 0.5s ease both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-header {
    margin-bottom: 36px;
  }

  .login-header h2 {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.9rem;
    color: var(--text-dark);
    margin-bottom: 8px;
    font-weight: 700;
  }

  .login-header p {
    color: var(--text-light);
    font-size: 0.9rem;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: #F0EDE8;
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 32px;
    position: relative;
  }

  .tab-slider {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    background: white;
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .tab-slider.right { transform: translateX(calc(100% + 8px)); }

  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.9rem;
    color: var(--text-light);
    cursor: pointer;
    position: relative;
    z-index: 1;
    border-radius: 10px;
    transition: color 0.3s;
  }

  .tab-btn.active { color: var(--text-dark); font-weight: 500; }

  /* Form */
  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 0.82rem;
    color: var(--text-mid);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .input-wrap {
    position: relative;
  }

  .input-wrap input {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.92rem;
    color: var(--text-dark);
    background: var(--warm-white);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  .input-wrap input:focus {
    border-color: var(--sage);
    box-shadow: 0 0 0 3px rgba(123,174,139,0.15);
  }

  .input-wrap input.error { border-color: var(--error); }
  .input-wrap input.error:focus { box-shadow: 0 0 0 3px rgba(224,92,92,0.12); }

  .input-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--text-light);
    display: flex;
    align-items: center;
    transition: color 0.2s;
  }

  .input-icon:hover { color: var(--text-mid); }

  .field-error {
    font-size: 0.78rem;
    color: var(--error);
    margin-top: 5px;
    display: none;
    align-items: center;
    gap: 4px;
  }

  .field-error.show { display: flex; }

  /* Alert messages */
  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-bottom: 20px;
    display: none;
    align-items: center;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  .alert.show { display: flex; }
  .alert.error { background: #FEF0F0; color: #C0392B; border: 1px solid #F9CACA; }
  .alert.success { background: #F0FBF5; color: #27AE60; border: 1px solid #B9E9CA; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Submit button */
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    margin-top: 8px;
    letter-spacing: 0.05em;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(90,144,112,0.35);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-primary:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .btn-primary .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .forgot-link {
    text-align: right;
    margin-top: 4px;
  }

  .forgot-link a {
    font-size: 0.8rem;
    color: var(--sage-dark);
    text-decoration: none;
    transition: color 0.2s;
  }

  .forgot-link a:hover { color: var(--deep-teal); text-decoration: underline; }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0;
    color: var(--text-light);
    font-size: 0.8rem;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .terms {
    font-size: 0.75rem;
    color: var(--text-light);
    text-align: center;
    margin-top: 20px;
    line-height: 1.6;
  }

  .terms a { color: var(--sage-dark); text-decoration: none; }
  .terms a:hover { text-decoration: underline; }

  /* Form panels */
  .form-panel { display: none; }
  .form-panel.active { display: block; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: white;
    border-radius: 24px;
    padding: 36px;
    width: 90%;
    max-width: 420px;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal h3 {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.3rem;
    color: var(--text-dark);
    margin-bottom: 8px;
  }

  .modal p {
    font-size: 0.88rem;
    color: var(--text-light);
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .btn-outline {
    flex: 1;
    padding: 12px;
    border: 1.5px solid var(--border);
    background: transparent;
    border-radius: 10px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.88rem;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-outline:hover { background: #F8F5EF; }

  .btn-secondary {
    flex: 1;
    padding: 12px;
    background: linear-gradient(135deg, var(--sage-dark), var(--sage));
    border: none;
    border-radius: 10px;
    color: white;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { opacity: 0.9; }

  /* Responsive */
  @media (max-width: 768px) {
    body { flex-direction: column; }
    .left-panel {
      width: 100%;
      min-height: 200px;
      padding: 30px 24px;
      justify-content: flex-start;
      flex-direction: row;
      align-items: center;
      gap: 20px;
    }
    .features { display: none; }
    .brand { margin-bottom: 0; display: flex; align-items: center; gap: 16px; }
    .brand-icon { margin: 0; width: 52px; height: 52px; }
    .brand h1 { font-size: 1.6rem; text-align: left; }
    .brand p { display: none; }
    .right-panel { width: 100%; flex: 1; padding: 24px; align-items: flex-start; }
    .login-box { max-width: 100%; }
  }
</style>
</head>
<body>

<!-- Left Panel -->
<div class="left-panel">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 40 40"><path d="M20 4C11.2 4 4 11.2 4 20s7.2 16 16 16 16-7.2 16-16S28.8 4 20 4zm0 6c2.2 0 4 1.8 4 4s-1.8 4-4 4-4-1.8-4-4 1.8-4 4-4zm8 18H12v-2c0-4 5.4-6 8-6s8 2 8 6v2z"/></svg>
    </div>
    <div>
      <h1>心 境</h1>
      <p>MindFlow · 认知行为疗法平台</p>
    </div>
  </div>

  <div class="features">
    <div class="feature-item">
      <div class="feature-icon">🧠</div>
      <div class="feature-text">
        <h3>AI认知重构</h3>
        <p>基于CBT疗法的智能对话辅助</p>
      </div>
    </div>
    <div class="feature-item">
      <div class="feature-icon">🌿</div>
      <div class="feature-text">
        <h3>正念冥想练习</h3>
        <p>专业音频引导，随时随地练习</p>
      </div>
    </div>
    <div class="feature-item">
      <div class="feature-icon">📊</div>
      <div class="feature-text">
        <h3>健康数据追踪</h3>
        <p>可视化洞察，了解心理健康趋势</p>
      </div>
    </div>
  </div>
</div>

<!-- Right Panel -->
<div class="right-panel">
  <div class="login-box">
    <div class="login-header">
      <h2>欢迎回来 👋</h2>
      <p>登录以继续您的心理健康之旅</p>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <div class="tab-slider" id="tabSlider"></div>
      <button class="tab-btn active" onclick="switchTab('login')">登 录</button>
      <button class="tab-btn" onclick="switchTab('register')">注 册</button>
    </div>

    <!-- Alert -->
    <div class="alert error" id="alertError">
      <span>⚠️</span>
      <span id="alertErrorText"></span>
    </div>
    <div class="alert success" id="alertSuccess">
      <span>✅</span>
      <span id="alertSuccessText"></span>
    </div>

    <!-- Login Form -->
    <div class="form-panel active" id="loginForm">
      <div class="form-group">
        <label class="form-label">用户名或邮箱</label>
        <div class="input-wrap">
          <input type="text" id="loginUser" placeholder="请输入用户名或邮箱" autocomplete="username">
        </div>
        <div class="field-error" id="loginUserError">请输入用户名</div>
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="input-wrap">
          <input type="password" id="loginPwd" placeholder="请输入密码" autocomplete="current-password" style="padding-right:44px">
          <span class="input-icon" onclick="togglePwd('loginPwd', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
        <div class="field-error" id="loginPwdError">请输入密码</div>
      </div>

      <div class="forgot-link">
        <a href="#" onclick="showForgotModal()">忘记密码？</a>
      </div>

      <button class="btn-primary" id="loginBtn" onclick="handleLogin()">登 录</button>

      <div class="terms">
        登录即表示您同意我们的
        <a href="#">服务条款</a> 和 <a href="#">隐私政策</a>
      </div>
    </div>

    <!-- Register Form -->
    <div class="form-panel" id="registerForm">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <div class="input-wrap">
          <input type="text" id="regUser" placeholder="设置您的用户名">
        </div>
        <div class="field-error" id="regUserError">用户名至少3个字符</div>
      </div>

      <div class="form-group">
        <label class="form-label">邮箱</label>
        <div class="input-wrap">
          <input type="email" id="regEmail" placeholder="请输入邮箱地址">
        </div>
        <div class="field-error" id="regEmailError">请输入有效的邮箱地址</div>
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="input-wrap">
          <input type="password" id="regPwd" placeholder="至少6位密码" style="padding-right:44px">
          <span class="input-icon" onclick="togglePwd('regPwd', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
        <div class="field-error" id="regPwdError">密码至少6位</div>
      </div>

      <div class="form-group">
        <label class="form-label">确认密码</label>
        <div class="input-wrap">
          <input type="password" id="regPwd2" placeholder="再次输入密码" style="padding-right:44px">
          <span class="input-icon" onclick="togglePwd('regPwd2', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
        <div class="field-error" id="regPwd2Error">两次密码不一致</div>
      </div>

      <button class="btn-primary" id="registerBtn" onclick="handleRegister()">创建账户</button>

      <div class="terms">
        注册即表示您同意我们的 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a>
      </div>
    </div>
  </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" id="forgotModal">
  <div class="modal">
    <h3>找回密码 🔑</h3>
    <p>请输入您注册时使用的邮箱地址，我们将向您发送重置密码的邮件。</p>
    <div class="form-group">
      <label class="form-label">注册邮箱</label>
      <div class="input-wrap">
        <input type="email" id="forgotEmail" placeholder="请输入邮箱地址">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeForgotModal()">取 消</button>
      <button class="btn-secondary" onclick="handleForgotPwd()">发送邮件</button>
    </div>
  </div>
</div>

<script>
  // ===== 配置 =====
  const API_BASE = window.API_BASE || 'https://psyxlzx-rakosnylmx.cn-hongkong.fcapp.run';

  let currentTab = 'login';

  // ===== 检查已登录 =====
  (function checkAuth() {
    const token = localStorage.getItem('mf_token');
    if (token) {
      window.location.href = 'main.html';
    }
  })();

  function switchTab(tab) {
    currentTab = tab;
    const slider = document.getElementById('tabSlider');
    const btns = document.querySelectorAll('.tab-btn');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    if (tab === 'login') {
      slider.classList.remove('right');
      btns[0].classList.add('active');
      btns[1].classList.remove('active');
      loginForm.classList.add('active');
      registerForm.classList.remove('active');
      document.querySelector('.login-header h2').textContent = '欢迎回来 👋';
      document.querySelector('.login-header p').textContent = '登录以继续您的心理健康之旅';
    } else {
      slider.classList.add('right');
      btns[1].classList.add('active');
      btns[0].classList.remove('active');
      registerForm.classList.add('active');
      loginForm.classList.remove('active');
      document.querySelector('.login-header h2').textContent = '加入心境 🌱';
      document.querySelector('.login-header p').textContent = '开始您的心理健康管理之旅';
    }

    hideAlerts();
  }

  function togglePwd(id, icon) {
    const input = document.getElementById(id);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    icon.innerHTML = showing
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  }

  function showAlert(type, text) {
    hideAlerts();
    const el = document.getElementById(`alert${type.charAt(0).toUpperCase() + type.slice(1)}`);
    document.getElementById(`alert${type.charAt(0).toUpperCase() + type.slice(1)}Text`).textContent = text;
    el.classList.add('show');
  }

  function hideAlerts() {
    document.getElementById('alertError').classList.remove('show');
    document.getElementById('alertSuccess').classList.remove('show');
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (loading) {
      btn.disabled = true;
      const text = btn.textContent;
      btn.dataset.text = text;
      btn.innerHTML = `<span class="spinner"></span>处理中...`;
    } else {
      btn.disabled = false;
      btn.textContent = btn.dataset.text;
    }
  }

  async function handleLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pwd = document.getElementById('loginPwd').value;
    let valid = true;

    if (!user) {
      document.getElementById('loginUserError').classList.add('show');
      document.getElementById('loginUser').classList.add('error');
      valid = false;
    } else {
      document.getElementById('loginUserError').classList.remove('show');
      document.getElementById('loginUser').classList.remove('error');
    }

    if (!pwd) {
      document.getElementById('loginPwdError').classList.add('show');
      document.getElementById('loginPwd').classList.add('error');
      valid = false;
    } else {
      document.getElementById('loginPwdError').classList.remove('show');
      document.getElementById('loginPwd').classList.remove('error');
    }

    if (!valid) return;

    setLoading('loginBtn', true);
    try {
      const resp = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pwd })
      });
      const data = await resp.json();
      if (!resp.ok) {
        showAlert('error', data.error || '登录失败');
        return;
      }
      // 保存登录信息
      localStorage.setItem('mf_token', data.token);
      localStorage.setItem('mf_username', data.username);
      localStorage.setItem('mf_profile', JSON.stringify(data.profile || {}));
      showAlert('success', '登录成功！正在跳转...');
      setTimeout(() => { window.location.href = 'main.html'; }, 1000);
    } catch (e) {
      showAlert('error', '网络错误，请检查连接后重试');
    } finally {
      setLoading('loginBtn', false);
    }
  }

  async function handleRegister() {
    const user = document.getElementById('regUser').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pwd = document.getElementById('regPwd').value;
    const pwd2 = document.getElementById('regPwd2').value;
    let valid = true;

    const checks = [
      { val: user.length >= 3, errId: 'regUserError', inputId: 'regUser' },
      { val: /\S+@\S+\.\S+/.test(email), errId: 'regEmailError', inputId: 'regEmail' },
      { val: pwd.length >= 6, errId: 'regPwdError', inputId: 'regPwd' },
      { val: pwd === pwd2 && pwd2.length > 0, errId: 'regPwd2Error', inputId: 'regPwd2' },
    ];

    checks.forEach(c => {
      if (!c.val) {
        document.getElementById(c.errId).classList.add('show');
        document.getElementById(c.inputId).classList.add('error');
        valid = false;
      } else {
        document.getElementById(c.errId).classList.remove('show');
        document.getElementById(c.inputId).classList.remove('error');
      }
    });

    if (!valid) return;

    setLoading('registerBtn', true);
    try {
      const resp = await fetch(`${API_BASE}/api/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, email, password: pwd })
      });
      const data = await resp.json();
      if (!resp.ok) {
        showAlert('error', data.error || '注册失败');
        return;
      }
      showAlert('success', '注册成功！请登录您的账户。');
      setTimeout(() => switchTab('login'), 1500);
    } catch (e) {
      showAlert('error', '网络错误，请检查连接后重试');
    } finally {
      setLoading('registerBtn', false);
    }
  }

  function showForgotModal() {
    document.getElementById('forgotModal').classList.add('show');
  }

  function closeForgotModal() {
    document.getElementById('forgotModal').classList.remove('show');
  }

  function handleForgotPwd() {
    const email = document.getElementById('forgotEmail').value.trim();
    if (!/\S+@\S+\.\S+/.test(email)) {
      showAlert('error', '请输入有效的邮箱地址');
      closeForgotModal();
      return;
    }
    closeForgotModal();
    showAlert('success', `请联系管理员重置密码，或通过注册邮箱找回。`);
  }

  // Enter key support
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (currentTab === 'login') handleLogin();
      else handleRegister();
    }
  });
</script>
</body>
</html>
